name: Buun PyPI publish
description: Publish the artifact python-build made to PyPI with trusted publishing and PEP 740 attestations. Use it as a step of a job in the product's OWN workflow file, with id-token write, on GitHub's runners. PyPI refuses trusted publishing from a reusable workflow, but a step like this one is fine.

inputs:
  artifact:
    description: The artifact python-build uploaded.
    default: python-dist
  repository-url:
    description: Empty for PyPI; https://test.pypi.org/legacy/ for TestPyPI.
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.artifact }}
        path: ${{ runner.temp }}/python-dist

    # PyPI's trusted publisher names this repository, the CALLING workflow file and, if set, its environment.
    - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
      with:
        packages-dir: ${{ runner.temp }}/python-dist
        repository-url: ${{ inputs.repository-url }}
        attestations: true
        skip-existing: true
        print-hash: true
