# A pnpm and turbo monorepo's deploys: main is checked against the last green deploy, then every Worker whose
# code changed deploys, found from its wrangler config. Nothing here names a Worker; a new app deploys unedited.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [production, preview]
        default: production
      workers:
        description: Empty for what changed since the last green deploy, names such as "api web", or "all".
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  ci:
    uses: buun-group/actions/.github/workflows/ci.yml@v1
    with:
      runs-on: ${{ vars.CI_RUNS_ON || '"ubuntu-latest"' }}
      base: last-success
      scope: ${{ inputs.workers == 'all' && 'full' || 'auto' }}
      standards-repository: ${{ vars.STANDARDS_REPOSITORY }}
      standards-app-client-id: ${{ vars.STANDARDS_APP_CLIENT_ID }}
      tasks: |
        *: pnpm lint
        *: pnpm -r $CI_PNPM_FILTER --if-present run typecheck
        *: pnpm -r $CI_PNPM_FILTER --if-present run test
    secrets:
      STANDARDS_APP_PRIVATE_KEY: ${{ secrets.STANDARDS_APP_PRIVATE_KEY }}

  deploy:
    needs: ci
    uses: buun-group/actions/.github/workflows/deploy-workers.yml@v1
    with:
      environment: ${{ inputs.environment || 'production' }}
      areas: ${{ needs.ci.outputs.areas }}
      full: ${{ needs.ci.outputs.full }}
      workers: ${{ inputs.workers }}
      runs-on: ${{ vars.CI_RUNS_ON || '"ubuntu-latest"' }}
      # rollout: '10,50,100'   # a canary; holds cost minutes, so only on a self-hosted runner
    secrets: inherit
