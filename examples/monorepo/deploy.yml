# Deploys the Workers whose code changed since the last green deploy: dev to preview (the beta), main to production.
# Copy to .github/workflows/deploy.yml as it is: nothing here names a Worker.
#
# The branch decides the environment, and the shared deploy refuses any other pairing: a manual run on a feature
# branch can deploy nothing, and only main reaches production. A manual run can name Workers, or "all".
# deploy-workers finds every Worker from its wrangler config; a Worker's own package.json may set
# "deploy": { "smokePath": "/health" } or "deploy": { "skip": true }.

name: deploy

on:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      workers:
        description: Empty for what changed since the last green deploy, names such as "api web", or "all".
        type: string
        default: ''

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: buun-group/actions/.github/workflows/ci.yml@v1
    with:
      base: last-success
      scope: ${{ inputs.workers == 'all' && 'full' || 'auto' }}
      standards-repository: ${{ vars.STANDARDS_REPOSITORY }}
      standards-app-client-id: ${{ vars.STANDARDS_APP_CLIENT_ID }}
      tasks: |
        *: pnpm lint
        *: pnpm -r $CI_PNPM_FILTER --if-present run typecheck
        *: pnpm -r $CI_PNPM_FILTER --if-present run test
    secrets:
      STANDARDS_APP_PRIVATE_KEY: ${{ secrets.STANDARDS_APP_PRIVATE_KEY }}

  deploy:
    needs: ci
    uses: buun-group/actions/.github/workflows/deploy-workers.yml@v1
    with:
      # main is production, dev is preview; deploy refuses any other branch.
      environment: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
      areas: ${{ needs.ci.outputs.areas }}
      full: ${{ needs.ci.outputs.full }}
      workers: ${{ inputs.workers }}
      # rollout: '10,50,100'   # a canary; holds cost minutes, so only on a self-hosted runner
    secrets: inherit
