name: Buun GitHub release
description: Tag a commit and cut a GitHub release for it, or only tag it. The tag can come from a version file, so a version bump merged to main releases itself. Safe to run again; an existing tag is left alone and its release gains only the files it lacks. Needs gh (GitHub's runners have it) and contents write.

inputs:
  tag:
    description: The tag, such as v1.2.0. Empty builds it from tag-prefix and the version in version-file.
    default: ''
  version-file:
    description: package.json, pyproject.toml, Cargo.toml, or a file holding only the version. Used when tag is empty.
    default: ''
  tag-prefix:
    description: Put before the version, such as v or core-v.
    default: v
  target:
    description: The commit to tag. Empty is the commit this run is on.
    default: ''
  release:
    description: "'false' creates the tag only."
    default: 'true'
  title:
    description: Empty uses the tag.
    default: ''
  notes:
    description: The release notes. Empty reads changelog, then falls back to notes GitHub generates from the commits since the last tag.
    default: ''
  changelog:
    description: A CHANGELOG.md whose section for this version ("## 1.2.0" or "## [1.2.0]") becomes the notes.
    default: ''
  prerelease:
    description: "'auto' marks versions with a hyphen (1.2.0-beta.1) as prereleases; 'true'; 'false'."
    default: auto
  draft:
    default: 'false'
  files:
    description: Files to attach, one glob per line.
    default: ''
  token:
    default: ${{ github.token }}

outputs:
  tag:
    value: ${{ steps.tag.outputs.tag }}
  version:
    value: ${{ steps.tag.outputs.version }}
  created:
    description: "'true' when this run created the tag."
    value: ${{ steps.release.outputs.created }}

runs:
  using: composite
  steps:
    - name: Work out the tag
      id: tag
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
        VERSION_FILE: ${{ inputs.version-file }}
        PREFIX: ${{ inputs.tag-prefix }}
      run: |
        set -euo pipefail
        version=""
        if [ -z "$TAG" ]; then
          test -n "$VERSION_FILE" || { echo "::error::Give tag or version-file."; exit 1; }
          test -f "$VERSION_FILE" || { echo "::error::$VERSION_FILE does not exist."; exit 1; }
          case "$VERSION_FILE" in
            *package.json) version="$(node -p "require(require('path').resolve(process.argv[1])).version" "$VERSION_FILE")" ;;
            *pyproject.toml|*Cargo.toml) version="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$VERSION_FILE" | head -1)" ;;
            *) version="$(tr -d '[:space:]' < "$VERSION_FILE")" ;;
          esac
          test -n "$version" || { echo "::error::No version found in $VERSION_FILE."; exit 1; }
          TAG="$PREFIX$version"
        else
          version="${TAG#"$PREFIX"}"
        fi
        if ! git check-ref-format "refs/tags/$TAG"; then echo "::error::$TAG is not a valid tag name."; exit 1; fi
        echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Tag and release
      id: release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
        TAG: ${{ steps.tag.outputs.tag }}
        VERSION: ${{ steps.tag.outputs.version }}
        TARGET: ${{ inputs.target || github.sha }}
        RELEASE: ${{ inputs.release }}
        TITLE: ${{ inputs.title }}
        NOTES: ${{ inputs.notes }}
        CHANGELOG: ${{ inputs.changelog }}
        PRERELEASE: ${{ inputs.prerelease }}
        DRAFT: ${{ inputs.draft }}
        FILES: ${{ inputs.files }}
      run: |
        set -euo pipefail
        command -v gh >/dev/null || { echo "::error::gh is not on this runner; install the GitHub CLI or use GitHub's runners."; exit 1; }

        if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
          created=false
          echo "$TAG already exists; left as it is." >> "$GITHUB_STEP_SUMMARY"
        else
          created=true
          if [ "$RELEASE" = false ]; then
            gh api "repos/$REPO/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$TARGET" >/dev/null
            echo "Tagged \`${TARGET:0:8}\` as $TAG." >> "$GITHUB_STEP_SUMMARY"
          fi
        fi
        echo "created=$created" >> "$GITHUB_OUTPUT"
        [ "$RELEASE" = false ] && exit 0

        files=()
        while IFS= read -r pattern; do
          [ -z "$pattern" ] && continue
          # shellcheck disable=SC2206
          matched=($pattern)
          [ -e "${matched[0]}" ] || { echo "::error::No file matches $pattern."; exit 1; }
          files+=("${matched[@]}")
        done <<<"$FILES"

        if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
          if [ "${#files[@]}" -gt 0 ]; then
            have="$(gh release view "$TAG" --repo "$REPO" --json assets -q '.assets[].name')"
            missing=()
            for file in "${files[@]}"; do grep -qxF "$(basename "$file")" <<<"$have" || missing+=("$file"); done
            if [ "${#missing[@]}" -gt 0 ]; then gh release upload "$TAG" --repo "$REPO" "${missing[@]}"; fi
          fi
          echo "The release $TAG exists; added only missing files." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        notes_args=()
        if [ -n "$NOTES" ]; then
          notes_args=(--notes "$NOTES")
        elif [ -n "$CHANGELOG" ] && [ -f "$CHANGELOG" ]; then
          section="$(awk -v v="$VERSION" '
            /^## / { if (found) exit; line=$0; gsub(/[][]/, "", line); split(line, words, " "); if (words[2] == v) { found=1; next } }
            found { print }' "$CHANGELOG")"
          if [ -n "$section" ]; then notes_args=(--notes "$section"); else notes_args=(--generate-notes); fi
        else
          notes_args=(--generate-notes)
        fi

        flags=(--repo "$REPO" --target "$TARGET" --title "${TITLE:-$TAG}")
        case "$PRERELEASE" in
          true) flags+=(--prerelease) ;;
          auto) case "$VERSION" in *-*) flags+=(--prerelease) ;; esac ;;
        esac
        [ "$DRAFT" = true ] && flags+=(--draft)
        gh release create "$TAG" "${flags[@]}" "${notes_args[@]}" "${files[@]}"
        echo "Released $TAG at \`${TARGET:0:8}\`." >> "$GITHUB_STEP_SUMMARY"
