# Checks main and deploys the Workers whose code changed since the last green deploy. Copy to
# .github/workflows/deploy.yml and add one job per Worker.
#
# base: last-success compares with this workflow's last successful run, so a failed deploy is retried by the next
# push. Each Worker's job runs when its package's area is true: @acme/api is the area api. A manual run deploys all.

name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [production, preview]
        default: production

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: buun-group/actions/.github/workflows/ci.yml@v1
    with:
      runs-on: ${{ vars.CI_RUNS_ON || '"ubuntu-latest"' }}
      standards-repository: ${{ vars.STANDARDS_REPOSITORY }}
      standards-app-client-id: ${{ vars.STANDARDS_APP_CLIENT_ID }}
      base: last-success
      tasks: |
        *: pnpm lint
        *: pnpm -r $CI_PNPM_FILTER --if-present run typecheck
        *: pnpm -r $CI_PNPM_FILTER --if-present run test
    secrets:
      STANDARDS_APP_PRIVATE_KEY: ${{ secrets.STANDARDS_APP_PRIVATE_KEY }}

  api:
    needs: ci
    if: fromJSON(needs.ci.outputs.areas).api
    uses: buun-group/actions/.github/workflows/deploy.yml@v1
    with:
      environment: ${{ inputs.environment || 'production' }}
      runs-on: ${{ vars.CI_RUNS_ON || '"ubuntu-latest"' }}
      working-directory: apps/api
      d1-database: DB
      smoke-path: /health
      url: https://api.example.com
      # rollout: '10,50,100'   # a canary; holds cost minutes, so only on a self-hosted runner
    secrets: inherit
