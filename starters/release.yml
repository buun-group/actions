# Releases every package whose version is not tagged yet. Copy to .github/workflows/release.yml and keep the file
# name: an npm trusted publisher names this repository and release.yml. Nothing here names a package.
#
# To release: bump the version (and a CHANGELOG.md section, if the package keeps one) and merge to main. Each new
# version is tested, published where its package.json's publishConfig says (npm by default, or GitHub Packages),
# tagged (v1.2.0 alone, core-v1.2.0 in a workspace) and released on GitHub with its notes.

name: release

on:
  # dev releases a beta (1.2.0-beta.N, a GitHub prerelease, npm dist-tag beta); main releases it as stable.
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: buun-group/actions/.github/workflows/release.yml@v1
    permissions:
      contents: write
      packages: write
      id-token: write
    with:
      runs-on: ${{ vars.CI_RUNS_ON || '"ubuntu-latest"' }}
      # include-private: true   # also tag and release private packages (an app, a CLI) without publishing
