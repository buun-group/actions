name: Buun Python build
description: Build a Python package's sdist and wheel with uv from its lockfile, check them, and upload them as an artifact for pypi-publish. Needs no OIDC token, so it can run on a self-hosted runner.

inputs:
  package-directory:
    description: The folder with pyproject.toml.
    default: .
  python-version:
    default: '3.12'
  test-command:
    description: Run in the package's folder before building, such as "uv run pytest". Empty skips it.
    default: ''
  artifact:
    description: The artifact name pypi-publish downloads.
    default: python-dist

outputs:
  name:
    value: ${{ steps.read.outputs.name }}
  version:
    value: ${{ steps.read.outputs.version }}
  exists:
    description: "'true' when PyPI already has this version, so there is nothing to publish."
    value: ${{ steps.read.outputs.exists }}

runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        python-version: ${{ inputs.python-version }}
        working-directory: ${{ inputs.package-directory }}
        enable-cache: true

    - name: Read the package, and whether PyPI has this version
      id: read
      shell: bash
      working-directory: ${{ inputs.package-directory }}
      run: |
        set -euo pipefail
        read -r name version < <(uv run --no-project python -c 'import tomllib; p = tomllib.load(open("pyproject.toml", "rb"))["project"]; print(p["name"], p["version"])')
        echo "name=$name" >> "$GITHUB_OUTPUT"
        echo "version=$version" >> "$GITHUB_OUTPUT"
        status="$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/$name/$version/json")"
        if [ "$status" = 200 ]; then
          echo "exists=true" >> "$GITHUB_OUTPUT"
          echo "$name $version is already on PyPI. Nothing to publish." >> "$GITHUB_STEP_SUMMARY"
        else
          echo "exists=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Test
      if: steps.read.outputs.exists == 'false' && inputs.test-command != ''
      shell: bash
      working-directory: ${{ inputs.package-directory }}
      env:
        COMMAND: ${{ inputs.test-command }}
      run: |
        uv sync --frozen --all-extras
        bash -euo pipefail -c "$COMMAND"

    - name: Build and check
      if: steps.read.outputs.exists == 'false'
      shell: bash
      working-directory: ${{ inputs.package-directory }}
      run: |
        set -euo pipefail
        rm -rf dist
        uv build --out-dir dist
        uvx --from 'twine==6.2.0' twine check --strict dist/*

    - if: steps.read.outputs.exists == 'false'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact }}
        path: ${{ inputs.package-directory }}/dist/
        if-no-files-found: error
        retention-days: 7
